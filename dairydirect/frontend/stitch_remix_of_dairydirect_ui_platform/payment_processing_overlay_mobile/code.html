<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        @keyframes custom-spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .animate-pastoral-spin {
            animation: custom-spin 2s linear infinite;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-background text-on-background font-body antialiased">
<!-- Mock Background Content (Checkout Page Context) -->
<main class="min-h-screen p-6 max-w-md mx-auto relative">
<header class="flex items-center gap-4 mb-8">
<span class="material-symbols-outlined text-primary">arrow_back</span>
<h1 class="text-xl font-bold tracking-tight text-primary">Checkout</h1>
</header>
<section class="space-y-6">
<div class="bg-surface-container-low p-5 rounded-[20px]">
<h2 class="text-sm font-semibold text-on-surface-variant mb-4">Order Summary</h2>
<div class="flex justify-between items-center mb-3">
<span class="text-on-surface">Farm Fresh Whole Milk x 2</span>
<span class="font-semibold text-primary">$8.50</span>
</div>
<div class="flex justify-between items-center mb-3">
<span class="text-on-surface">Artisanal Butter</span>
<span class="font-semibold text-primary">$6.00</span>
</div>
<div class="border-t border-outline-variant/20 pt-3 flex justify-between items-center">
<span class="font-bold text-on-surface">Total</span>
<span class="font-bold text-primary text-lg">$14.50</span>
</div>
</div>
<div class="bg-surface-container-low p-5 rounded-[20px]">
<h2 class="text-sm font-semibold text-on-surface-variant mb-4">Payment Method</h2>
<div class="flex items-center gap-3 bg-surface-container-lowest p-3 rounded-xl">
<span class="material-symbols-outlined text-secondary">credit_card</span>
<span class="text-sm font-medium">•••• •••• •••• 4242</span>
</div>
</div>
</section>
<!-- Overlay Backdrop -->
<div class="fixed inset-0 z-[100] flex items-center justify-center p-6">
<!-- Dark semi-transparent backdrop with blur -->
<div class="absolute inset-0 bg-inverse-surface/60 backdrop-blur-sm"></div>
<!-- Modal Card (The Centerpiece) -->
<div class="relative bg-surface rounded-[20px] shadow-[0_12px_32px_rgba(63,101,48,0.12)] w-full max-w-[320px] p-8 flex flex-col items-center text-center overflow-hidden">
<!-- Pastoral Glass Decoration (Subtle background element) -->
<div class="absolute -top-12 -right-12 w-32 h-32 bg-primary-fixed/20 rounded-full blur-3xl"></div>
<div class="absolute -bottom-12 -left-12 w-32 h-32 bg-secondary-fixed/20 rounded-full blur-3xl"></div>
<!-- Animated Spinner Container -->
<div class="relative mb-8 mt-2">
<!-- Outer ring -->
<div class="w-20 h-20 rounded-full border-4 border-surface-container-high"></div>
<!-- Spinning accent -->
<div class="absolute inset-0 w-20 h-20 rounded-full border-4 border-transparent border-t-primary animate-pastoral-spin"></div>
<!-- Center Icon -->
<div class="absolute inset-0 flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-3xl" data-icon="payments">payments</span>
</div>
</div>
<!-- Content -->
<div class="space-y-3 relative z-10">
<h3 class="text-xl font-bold tracking-tight text-primary">Processing Payment...</h3>
<p class="text-on-surface-variant text-sm leading-relaxed px-2">
                        We're securing your farm-to-table delivery. Please stay with us.
                    </p>
</div>
<!-- Footnote / Warning -->
<div class="mt-8 pt-6 border-t border-outline-variant/20 w-full">
<div class="inline-flex items-center gap-2 px-3 py-1.5 bg-surface-container-high rounded-full">
<span class="material-symbols-outlined text-[16px] text-secondary">info</span>
<span class="text-[11px] font-bold tracking-wide uppercase text-on-surface-variant">Do not close the app</span>
</div>
</div>
<!-- Image Accent (The Milk Drop Pattern as a mask for texture) -->
<div class="absolute bottom-0 right-0 w-16 h-16 opacity-5 pointer-events-none">
<img alt="" class="w-full h-full object-cover" data-alt="abstract organic fluid shape resembling a milk splash minimalist botanical line art in shades of green and cream" src="https://lh3.googleusercontent.com/aida-public/AB6AXuC3drmYzV_-EmCO17pSIvsS5Amv28WlfnMR8w1jPRSunpMECQDOSCtAftAEyVqJBxmKklbROX332ozNi_IKjJc-nu2naZaweGUFbjNmQQ-zEd91Fk68xAHiwR_WHDuqDQYyapy3b4Y1vxBzYvtSBtbSgkx-pD0zG5Yy6l2gW2Y3fXscNudfnIswQzM6P3xi3WHFlS5DWaCGA93dDHmJu64JcMB7bj2-nTrl7l4gE3dP_8-QNrY8Npxis0NlHZ8mGO7LEgO4UicQYoQ"/>
</div>
</div>
</div>
</main>
<!-- Suppressed Bottom Navigation for focused transaction -->
<!-- Navigation shell is hidden to prioritize the processing canvas as per UX Goal -->
</body></html>
