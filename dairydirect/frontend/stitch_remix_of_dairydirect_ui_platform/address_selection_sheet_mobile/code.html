<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "tertiary-fixed": "#bfedce",
                    "surface-dim": "#dadad4",
                    "outline": "#73796d",
                    "inverse-on-surface": "#f1f1ea",
                    "on-primary-container": "#f8ffee",
                    "surface-container-low": "#f4f4ed",
                    "secondary-fixed-dim": "#ffb787",
                    "secondary-fixed": "#ffdcc7",
                    "on-secondary-fixed-variant": "#6e3910",
                    "surface-tint": "#426832",
                    "on-tertiary": "#ffffff",
                    "on-tertiary-container": "#f6fff5",
                    "surface-container": "#eeeee7",
                    "primary": "#3f6530",
                    "surface-container-highest": "#e3e3dc",
                    "on-secondary": "#ffffff",
                    "on-primary-fixed": "#042100",
                    "secondary-container": "#fdb07d",
                    "on-error": "#ffffff",
                    "on-error-container": "#93000a",
                    "primary-container": "#577f46",
                    "surface-bright": "#fafaf3",
                    "primary-fixed-dim": "#a7d392",
                    "outline-variant": "#c3c9bb",
                    "on-primary": "#ffffff",
                    "tertiary-fixed-dim": "#a4d1b3",
                    "inverse-primary": "#a7d392",
                    "secondary": "#8a5025",
                    "error": "#ba1a1a",
                    "surface-container-high": "#e8e9e2",
                    "on-secondary-container": "#774117",
                    "on-surface-variant": "#43493e",
                    "on-tertiary-fixed-variant": "#264f38",
                    "surface": "#fafaf3",
                    "on-tertiary-fixed": "#002111",
                    "primary-fixed": "#c2efac",
                    "on-background": "#1a1c18",
                    "on-surface": "#1a1c18",
                    "error-container": "#ffdad6",
                    "tertiary": "#3b644c",
                    "on-secondary-fixed": "#311300",
                    "inverse-surface": "#2f312d",
                    "background": "#fafaf3",
                    "surface-container-lowest": "#ffffff",
                    "tertiary-container": "#537e64",
                    "surface-variant": "#e3e3dc",
                    "on-primary-fixed-variant": "#2a4f1d"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "fontFamily": {
                    "headline": ["Inter"],
                    "body": ["Inter"],
                    "label": ["Inter"]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .bottom-sheet-active {
            height: 92%;
            border-top-left-radius: 2.5rem;
            border-top-right-radius: 2.5rem;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface font-body text-on-surface">
<!-- Mock Background Page (To simulate overlay context) -->
<main class="min-h-screen px-6 pt-12 opacity-40 select-none pointer-events-none">
<header class="mb-8">
<h1 class="text-4xl font-bold tracking-tighter text-primary mb-2">DairyDirect</h1>
<p class="text-on-surface-variant">Your Daily Pastoral Freshness</p>
</header>
<div class="space-y-6">
<div class="h-48 bg-surface-container rounded-3xl"></div>
<div class="grid grid-cols-2 gap-4">
<div class="h-32 bg-surface-container-high rounded-2xl"></div>
<div class="h-32 bg-surface-container-high rounded-2xl"></div>
</div>
<div class="h-40 bg-surface-container-low rounded-3xl"></div>
</div>
</main>
<!-- Bottom Sheet Overlay Container -->
<div class="fixed inset-0 bg-on-background/20 backdrop-blur-sm z-50 flex flex-col justify-end">
<!-- The Bottom Sheet -->
<div class="bottom-sheet-active bg-surface shadow-[0_-12px_40px_rgba(63,101,48,0.12)] flex flex-col overflow-hidden">
<!-- Handle -->
<div class="flex justify-center py-4 shrink-0">
<div class="w-12 h-1.5 bg-surface-container-highest rounded-full"></div>
</div>
<!-- Content Scrollable Area -->
<div class="flex-1 overflow-y-auto px-6 pb-24">
<!-- Header -->
<div class="mb-8 mt-2">
<h2 class="text-3xl font-bold tracking-tight text-on-surface mb-1">Add Address</h2>
<p class="text-on-surface-variant text-sm">Where should we deliver your fresh harvest?</p>
</div>
<!-- Address Type Tabs -->
<div class="flex gap-3 mb-8 overflow-x-auto pb-2">
<button class="flex items-center gap-2 bg-primary text-on-primary px-6 py-3 rounded-full font-semibold shadow-md transition-all active:scale-95">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">home</span>
<span>Home</span>
</button>
<button class="flex items-center gap-2 bg-surface-container-lowest text-on-surface-variant border border-outline-variant/30 px-6 py-3 rounded-full font-medium transition-all hover:bg-surface-container-low active:scale-95">
<span class="material-symbols-outlined text-[20px]">work</span>
<span>Work</span>
</button>
<button class="flex items-center gap-2 bg-surface-container-lowest text-on-surface-variant border border-outline-variant/30 px-6 py-3 rounded-full font-medium transition-all hover:bg-surface-container-low active:scale-95">
<span class="material-symbols-outlined text-[20px]">location_on</span>
<span>Other</span>
</button>
</div>
<!-- Map Picker Card -->
<div class="mb-8 relative group">
<div class="w-full h-44 rounded-3xl overflow-hidden bg-surface-container-high shadow-inner">
<img class="w-full h-full object-cover grayscale-[0.2] contrast-[0.9] brightness-[1.05]" data-alt="stylized map view of an organic suburban neighborhood with soft green parks and cream colored roads" data-location="Verdant Valleys" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBPCt0_uFKfebr42NPW_rDyjR70nC2Ahmb6OvDop13VARKTusn3lq0pdvmz7PiLc1gAThsORzOLuAYX81eFRg_Kry8NpfgqwxXYlFxZnRAd7qV12iVs6XgjHy95PvcNipq1JZLLq1fLgvxscZDXb7OQj1yk_-G7JAZRwDZhQnwNlyEmRVaeF9FeBz9011goQyDhczcXkenX1JM-BI2Fh9Rt-OxYPlfDjVetAToELka3IEDxbTbISepxKvaOx63fR_fq6XPbaKnHcfs"/>
<!-- Floating Pin Overlay -->
<div class="absolute inset-0 flex items-center justify-center pointer-events-none">
<div class="flex flex-col items-center">
<div class="bg-primary text-white p-2 rounded-full shadow-lg mb-1 animate-bounce">
<span class="material-symbols-outlined text-[24px]" style="font-variation-settings: 'FILL' 1;">location_on</span>
</div>
<div class="bg-white/90 backdrop-blur-md px-3 py-1 rounded-lg text-[10px] font-bold text-primary uppercase tracking-widest shadow-sm">
                                    Drop Pin
                                </div>
</div>
</div>
</div>
<div class="absolute bottom-4 right-4 bg-surface-container-lowest/90 backdrop-blur-sm p-3 rounded-2xl shadow-lg flex items-center gap-2 text-primary">
<span class="material-symbols-outlined text-[20px]">my_location</span>
<span class="text-xs font-bold">Use Current Location</span>
</div>
</div>
<!-- Form Fields -->
<form class="space-y-6">
<div class="space-y-2">
<label class="text-xs font-bold text-primary uppercase tracking-widest px-1">Recipient Name</label>
<input class="w-full bg-surface-container-low border-0 rounded-2xl p-4 text-on-surface placeholder:text-on-surface-variant/50 focus:ring-2 focus:ring-primary/20 focus:bg-surface-container-lowest transition-all" placeholder="e.g. Eleanor Rigby" type="text"/>
</div>
<div class="space-y-2">
<label class="text-xs font-bold text-primary uppercase tracking-widest px-1">Phone Number</label>
<div class="flex gap-3">
<div class="bg-surface-container-low rounded-2xl px-4 py-4 text-on-surface-variant font-medium flex items-center gap-2 shrink-0">
<span class="text-sm">+1</span>
<span class="material-symbols-outlined text-[16px]">expand_more</span>
</div>
<input class="w-full bg-surface-container-low border-0 rounded-2xl p-4 text-on-surface placeholder:text-on-surface-variant/50 focus:ring-2 focus:ring-primary/20 focus:bg-surface-container-lowest transition-all" placeholder="000 000 0000" type="tel"/>
</div>
</div>
<div class="space-y-2">
<label class="text-xs font-bold text-primary uppercase tracking-widest px-1">Address Line 1</label>
<input class="w-full bg-surface-container-low border-0 rounded-2xl p-4 text-on-surface placeholder:text-on-surface-variant/50 focus:ring-2 focus:ring-primary/20 focus:bg-surface-container-lowest transition-all" placeholder="Flat, House no., Building, Company" type="text"/>
</div>
<div class="grid grid-cols-2 gap-4">
<div class="space-y-2">
<label class="text-xs font-bold text-primary uppercase tracking-widest px-1">Pincode</label>
<input class="w-full bg-surface-container-low border-0 rounded-2xl p-4 text-on-surface placeholder:text-on-surface-variant/50 focus:ring-2 focus:ring-primary/20 focus:bg-surface-container-lowest transition-all" placeholder="6-digits" type="number"/>
</div>
<div class="space-y-2">
<label class="text-xs font-bold text-primary uppercase tracking-widest px-1">City</label>
<input class="w-full bg-surface-container-low border-0 rounded-2xl p-4 text-on-surface placeholder:text-on-surface-variant/50 focus:ring-2 focus:ring-primary/20 focus:bg-surface-container-lowest transition-all" placeholder="Locality" type="text"/>
</div>
</div>
<!-- Additional Details Toggle -->
<div class="pt-2">
<button class="flex items-center justify-between w-full p-4 rounded-2xl bg-surface-container-low hover:bg-surface-container-high transition-colors" type="button">
<span class="text-sm font-semibold text-on-surface">Add Delivery Instructions</span>
<span class="material-symbols-outlined text-primary">add_circle</span>
</button>
</div>
</form>
</div>
<!-- Footer Action Button -->
<div class="fixed bottom-0 left-0 w-full p-6 bg-surface/80 backdrop-blur-xl flex gap-4 items-center">
<button class="flex-1 bg-primary text-on-primary py-5 rounded-2xl font-bold text-lg shadow-[0_8px_24px_rgba(63,101,48,0.25)] transition-all active:scale-95 hover:brightness-110">
                    Save Address
                </button>
</div>
</div>
</div>
</body></html>
