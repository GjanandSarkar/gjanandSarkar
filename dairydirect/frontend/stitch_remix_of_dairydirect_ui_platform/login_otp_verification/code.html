<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                "error-container": "#ffdad6",
                "primary-container": "#577f46",
                "surface": "#fafaf3",
                "inverse-surface": "#2f312d",
                "on-surface-variant": "#43493e",
                "secondary-container": "#fdb07d",
                "on-background": "#1a1c18",
                "tertiary-container": "#537e64",
                "surface-container": "#eeeee7",
                "on-secondary-fixed": "#311300",
                "error": "#ba1a1a",
                "primary-fixed": "#c2efac",
                "on-primary-fixed-variant": "#2a4f1d",
                "primary": "#3f6530",
                "on-tertiary-fixed": "#002111",
                "surface-bright": "#fafaf3",
                "secondary-fixed-dim": "#ffb787",
                "inverse-primary": "#a7d392",
                "on-tertiary-container": "#f6fff5",
                "on-tertiary": "#ffffff",
                "surface-container-highest": "#e3e3dc",
                "secondary": "#8a5025",
                "surface-container-high": "#e8e9e2",
                "tertiary": "#3b644c",
                "tertiary-fixed": "#bfedce",
                "surface-tint": "#426832",
                "primary-fixed-dim": "#a7d392",
                "on-tertiary-fixed-variant": "#264f38",
                "surface-container-lowest": "#ffffff",
                "tertiary-fixed-dim": "#a4d1b3",
                "on-error": "#ffffff",
                "surface-variant": "#e3e3dc",
                "on-error-container": "#93000a",
                "background": "#fafaf3",
                "outline": "#73796d",
                "on-secondary": "#ffffff",
                "surface-container-low": "#f4f4ed",
                "on-secondary-container": "#774117",
                "on-primary-container": "#f8ffee",
                "on-primary": "#ffffff",
                "outline-variant": "#c3c9bb",
                "inverse-on-surface": "#f1f1ea",
                "on-secondary-fixed-variant": "#6e3910",
                "secondary-fixed": "#ffdcc7",
                "surface-dim": "#dadad4",
                "on-surface": "#1a1c18",
                "on-primary-fixed": "#042100"
            },
            "borderRadius": {
                "DEFAULT": "0.25rem",
                "lg": "0.5rem",
                "xl": "0.75rem",
                "full": "9999px"
            },
            "fontFamily": {
                "headline": ["Inter"],
                "body": ["Inter"],
                "label": ["Inter"]
            }
          }
        }
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #fafaf3;
            color: #1a1c18;
        }
        .otp-input {
            width: 52px;
            height: 52px;
            text-align: center;
            font-size: 24px;
            font-weight: 600;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="min-h-screen flex flex-col items-center justify-start overflow-x-hidden">
<!-- Top Navigation (Shell Suppressed per Task Requirements for Focused Journey) -->
<header class="w-full max-w-md px-6 pt-8 flex items-center">
<button aria-label="Go back" class="w-10 h-10 flex items-center justify-center rounded-full surface-container-low hover:bg-surface-container transition-colors active:scale-95">
<span class="material-symbols-outlined text-on-surface">arrow_back</span>
</button>
</header>
<main class="w-full max-w-md px-6 pt-10 flex flex-col flex-grow">
<!-- Brand/Identity Element (Subtle pastoral touch) -->
<div class="mb-12 flex flex-col items-center">
<div class="w-20 h-20 bg-primary-container rounded-[32%_68%_53%_47%_/_48%_30%_70%_52%] flex items-center justify-center shadow-lg mb-6">
<span class="material-symbols-outlined text-on-primary-container text-4xl" style="font-variation-settings: 'FILL' 1;">mark_email_read</span>
</div>
<!-- Heading & Subtitle -->
<div class="text-center">
<h1 class="text-[28px] font-bold leading-tight tracking-tight text-on-surface mb-3">Verify OTP</h1>
<p class="text-on-surface-variant text-base leading-relaxed">
                    We sent a 6-digit code to <span class="font-semibold text-on-surface">+91 XXXXX XXXXX</span>
</p>
</div>
</div>
<!-- OTP Inputs Grid -->
<div class="flex justify-between gap-2 mb-8">
<input class="otp-input rounded-xl border-none bg-surface-container-high focus:bg-surface-container-lowest focus:ring-2 focus:ring-primary/20 text-on-surface placeholder-outline-variant transition-all" maxlength="1" type="text" value="4"/>
<input class="otp-input rounded-xl border-none bg-surface-container-high focus:bg-surface-container-lowest focus:ring-2 focus:ring-primary/20 text-on-surface placeholder-outline-variant transition-all" maxlength="1" type="text" value="8"/>
<input class="otp-input rounded-xl border-none bg-surface-container-high focus:bg-surface-container-lowest focus:ring-2 focus:ring-primary/20 text-on-surface placeholder-outline-variant transition-all" maxlength="1" type="text" value="2"/>
<!-- Active/Focus State placeholder -->
<input autofocus="" class="otp-input rounded-xl border-none bg-surface-container-lowest ring-2 ring-primary/40 text-on-surface shadow-sm transition-all" maxlength="1" type="text"/>
<input class="otp-input rounded-xl border-none bg-surface-container-high focus:bg-surface-container-lowest focus:ring-2 focus:ring-primary/20 text-on-surface placeholder-outline-variant transition-all" maxlength="1" type="text"/>
<input class="otp-input rounded-xl border-none bg-surface-container-high focus:bg-surface-container-lowest focus:ring-2 focus:ring-primary/20 text-on-surface placeholder-outline-variant transition-all" maxlength="1" type="text"/>
</div>
<!-- Resend Section -->
<div class="flex flex-col items-center gap-2 mb-12">
<p class="text-on-surface-variant text-sm">Didn't receive the code?</p>
<button class="text-[#6e975c] font-semibold text-base hover:opacity-80 transition-opacity active:scale-95 flex items-center gap-1">
<span class="material-symbols-outlined text-[18px]">history</span>
                Resend
            </button>
</div>
<!-- Primary Action -->
<div class="mt-auto pb-10">
<button class="w-full py-4 bg-primary text-on-primary rounded-xl font-bold text-lg shadow-[0_12px_32px_rgba(63,101,48,0.15)] hover:shadow-[0_16px_40px_rgba(63,101,48,0.2)] hover:bg-primary-container transition-all active:scale-[0.98]">
                Verify &amp; Continue
            </button>
</div>
</main>
<!-- Contextual Graphic (The "Artisanal" Touch) -->
<div class="w-full max-w-lg mt-auto pointer-events-none opacity-20">
<div class="h-40 overflow-hidden relative">
<!-- Asymmetrical organic shapes suggesting a farm/pasture -->
<div class="absolute bottom-0 left-[-10%] w-[120%] h-32 bg-primary-container/20 rounded-[50%_50%_0_0] blur-3xl"></div>
<div class="absolute bottom-[-20%] right-[0%] w-[60%] h-40 bg-secondary-container/10 rounded-full blur-2xl"></div>
</div>
</div>
<!-- Decorative Image Card (Editorialism) -->
<section class="hidden md:flex fixed right-12 top-1/2 -translate-y-1/2 w-80 h-[500px] rounded-3xl overflow-hidden shadow-2xl z-0 transform rotate-2">
<img alt="Fresh Farm Delivery" class="w-full h-full object-cover" data-alt="Close-up of fresh organic milk bottle sitting on a rustic wooden table with soft morning sunlight streaming through a window" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCidObAr5LLGZz0SlMqvZJmn1fo2-EmIcmSb_ovMDppPteIDCQYH7m5qwQsAlUuds8Lj4TyB5SjjUFYcWSKrh7PdI_IQFA094v0ATp6OTQDq-msffGbBGmcVbs2C82m8JJDvoPeARrQtoHzDLBVmZhqW8KNzX3Um9z15LsZGQ62Fpty-xsU75LMxE1cwrlN-K3pg-6ag6rCIh2jJNnQi-IkD7nzdHJeE9DqhL2Co0Us3ZNgnFgnSrqLVv6EW6DMJO_aJQKsRAUvd7U"/>
<div class="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent flex flex-col justify-end p-8">
<p class="text-white font-bold text-xl leading-tight">Freshness delivered from our pasture to your doorstep.</p>
</div>
</section>
</body></html>
